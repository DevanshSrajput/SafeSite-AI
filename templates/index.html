<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeSite AI - Live Monitoring</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="page-live">
    <nav class="navbar">
        <div class="nav-brand">
            <span class="nav-icon">&#9881;</span>
            <h1>SAFESITE<span class="brand-dot">.</span>AI</h1>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link active">Live Monitor</a>
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/reports" class="nav-link">Reports</a>
        </div>
        <div class="nav-status">
            <span class="status-dot"></span>
            <span>ONLINE</span>
        </div>
    </nav>

    <main class="live-shell">
        <section class="live-video">
            <div class="panel-head">
                <h3>LIVE FEED</h3>
                <div class="chip-row">
                    <span class="chip chip-yellow">PPE</span>
                    <span class="chip chip-cyan">ZONES</span>
                    <span class="chip chip-pink">LOG</span>
                </div>
            </div>
            <div class="video-container" id="videoContainer">
                <img id="videoFeed" src="" alt="Video feed">
                <canvas id="zoneCanvas"></canvas>
                <div id="noFeedOverlay" class="no-feed-overlay">
                    <div class="overlay-title">STANDING BY</div>
                    <p class="overlay-copy">Pick a source on the right and hit START.</p>
                </div>
            </div>
        </section>

        <aside class="live-controls">
            <section class="brick brick-yellow">
                <div class="brick-head">
                    <h3>SOURCE</h3>
                </div>
                <div class="field">
                    <label for="videoSource">Video Source</label>
                    <select id="videoSource">
                        <option value="0">Webcam</option>
                    </select>
                </div>
                <div class="btn-row">
                    <button id="btnStart" class="btn btn-primary" onclick="startMonitoring()">START</button>
                    <button id="btnStop" class="btn btn-danger" onclick="stopMonitoring()">STOP</button>
                </div>
            </section>

            <section class="brick brick-cyan">
                <div class="brick-head">
                    <h3>INPUT / ALERTS</h3>
                </div>
                <div class="btn-row">
                    <label class="btn btn-secondary btn-file">
                        UPLOAD
                        <input type="file" id="videoUpload" accept="video/*" onchange="uploadVideo(this)">
                    </label>
                    <button id="btnToggleDetection" class="btn btn-secondary" onclick="toggleDetection()">
                        DET: ON
                    </button>
                    <button id="btnToggleVoice" class="btn btn-secondary" onclick="toggleVoice()">
                        VOICE: ON
                    </button>
                </div>
                <div id="uploadStatus" class="status-message" style="display:none;"></div>
            </section>

            <section class="brick brick-pink">
                <div class="brick-head">
                    <h3>ZONES</h3>
                </div>
                <div class="zone-form">
                    <input type="text" id="zoneName" placeholder="Zone name">
                    <input type="color" id="zoneColor" value="#FF0000">
                </div>
                <div class="btn-row btn-row-tight">
                    <button class="btn btn-primary btn-sm" onclick="startDrawingZone()">DRAW</button>
                    <button class="btn btn-secondary btn-sm" onclick="finishZone()">SAVE</button>
                    <button class="btn btn-danger btn-sm" onclick="cancelZone()">X</button>
                </div>
                <div id="zoneList" class="zone-list"></div>
            </section>

            <section class="brick brick-green">
                <div class="brick-head">
                    <h3>STATS</h3>
                </div>
                <div class="stats-mini">
                    <div class="stat-mini">
                        <span class="stat-mini-label">TOTAL</span>
                        <span id="statTotal" class="stat-mini-val">0</span>
                    </div>
                    <div class="stat-mini">
                        <span class="stat-mini-label">HELMET</span>
                        <span id="statHelmet" class="stat-mini-val">0</span>
                    </div>
                    <div class="stat-mini">
                        <span class="stat-mini-label">ZONE</span>
                        <span id="statZone" class="stat-mini-val">0</span>
                    </div>
                </div>
            </section>

            <section class="brick brick-white brick-feed">
                <div class="brick-head">
                    <h3>RECENT</h3>
                </div>
                <div id="violationFeed" class="violation-feed">
                    <p class="muted">No violations yet.</p>
                </div>
            </section>
        </aside>
    </main>

    <script>
        const zones = {{ zones | safe }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
